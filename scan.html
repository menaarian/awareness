<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Marcyrl Cybersecurity Scanner – فحص الروابط</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8eef1; --panel:#ffffff; --ink:#10232f; --muted:#5a6d79; --line:#d3dde3;
  --brand:#0e5a6b; --brand-ink:#ffffff; --chip:#eef3f6;
  --safe:#13795b; --safe-bg:#dff3ea; --bad:#c2410c; --bad-bg:#fde8dc; --warn:#8a5a00; --warn-bg:#fff1cc;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c171e; --panel:#142630; --ink:#e7f0f4; --muted:#93a8b3; --line:#27404d;
    --brand:#3fb4cc; --brand-ink:#06222b; --chip:#1b3340;
    --safe:#5fd1a5; --safe-bg:#12392d; --bad:#ff9a64; --bad-bg:#42241a; --warn:#f2c46b; --warn-bg:#3c3014;
  }
}
:root[data-theme="dark"]{
  --bg:#0c171e; --panel:#142630; --ink:#e7f0f4; --muted:#93a8b3; --line:#27404d;
  --brand:#3fb4cc; --brand-ink:#06222b; --chip:#1b3340;
  --safe:#5fd1a5; --safe-bg:#12392d; --bad:#ff9a64; --bad-bg:#42241a; --warn:#f2c46b; --warn-bg:#3c3014;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.75;font-size:16px;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 40px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand svg{flex:none}
.brand b{display:block;font-size:1.15rem;line-height:1.3;direction:ltr;text-align:right}
.brand small{color:var(--muted)}
h1{font-size:1.35rem;line-height:1.5;margin:0 0 4px;font-weight:700}
.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
.row{display:flex;gap:10px;margin-top:14px}
input{flex:1;min-width:0;font-family:inherit;font-size:1rem;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);direction:ltr;text-align:left}
.btn{font-family:inherit;font-size:1rem;font-weight:700;border:0;border-radius:10px;padding:0 24px;background:var(--brand);color:var(--brand-ink);cursor:pointer}
.btn:disabled{opacity:.55;cursor:default}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.note{font-size:.85rem;color:var(--muted);margin:12px 0 0}

.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;width:35%;background:var(--brand);border-radius:3px}
@media (prefers-reduced-motion: no-preference){
  .bar i{animation:slide 1.4s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
  .res{animation:in .25s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
[dir="rtl"] .bar i{margin-inline-start:0}

.res{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.gauge{width:120px;height:120px;flex:none}
.gauge text{fill:var(--ink);font-family:inherit}
.verdict{flex:1;min-width:180px}
.v{font-size:1.9rem;font-weight:700;line-height:1.35;margin:0}
.v.safe{color:var(--safe)} .v.bad{color:var(--bad)} .v.review{color:var(--warn)}
.hint{margin:6px 0 0;color:var(--muted)}
.target{margin-top:14px;padding:8px 12px;background:var(--chip);border-radius:8px;direction:ltr;text-align:left;word-break:break-all;font-size:.9rem}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.stat{flex:1;min-width:90px;background:var(--chip);border-radius:10px;padding:8px 12px;text-align:center}
.stat b{display:block;font-size:1.25rem}
.stat span{font-size:.85rem;color:var(--muted)}
.err{background:var(--bad-bg);border:1px solid var(--bad);color:var(--ink);border-radius:12px;padding:14px 16px}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <svg width="44" height="44" viewBox="0 0 48 48" aria-hidden="true">
      <path d="M24 3 6 10v13c0 11 7.5 19.5 18 22 10.5-2.5 18-11 18-22V10L24 3Z" fill="var(--brand)"/>
      <path d="m16 24 6 6 11-12" fill="none" stroke="var(--brand-ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div><b>Marcyrl Cybersecurity Scanner</b><small>فحص الروابط بمحركات الحماية</small></div>
  </header>

  <section class="panel">
    <h1>اتأكد من الرابط قبل ما تفتحه</h1>
    <p class="muted" style="margin:0">الصق الرابط هنا وهيتفحص بواسطة عشرات محركات الحماية.</p>
    <div class="row">
      <input id="u" type="text" inputmode="url" placeholder="https://example.com" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="الرابط">
      <button class="btn" id="go">افحص</button>
    </div>
    <p class="note">متفحصش روابط فيها باسورد أو توكن، زي روابط المشاركة الخاصة.</p>
  </section>

  <section id="out" aria-live="polite"></section>
</div>

<script>
var SCAN_URL = "https://script.google.com/macros/s/AKfycbzNdTpd4Elw5zDSxeRg_d58iFmI0NpoxVLswerUVxsQN3eABQAOtshTuIjlT2FW5dUJfw/exec";

var $ = function(i){ return document.getElementById(i); };
var busy = false, tick = null;

function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function call(p){
  return fetch(SCAN_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(p)})
    .then(function(r){ return r.json(); });
}
function msg(code){
  if(code==="invalid") return "الرابط غير صحيح. اكتبه كامل زي https://example.com";
  if(code==="busy")    return "الخدمة مشغولة دلوقتي. جرّب بعد دقيقة.";
  if(code==="net")     return "تعذّر الاتصال بخدمة الفحص. اتأكد من الإنترنت وجرّب تاني.";
  return "حصلت مشكلة في الفحص. حاول تاني بعد شوية.";
}
function stopTimer(){ if(tick){ clearInterval(tick); tick=null; } }

function showScanning(){
  $("out").innerHTML =
    '<div class="panel"><div class="bar"><i></i></div>'+
    '<p style="margin:0">جاري الفحص... <b id="sec">0</b> ثانية</p>'+
    '<p class="muted" style="margin:4px 0 0">ممكن ياخد حتى دقيقة، سيب الصفحة مفتوحة.</p></div>';
  var s = 0; stopTimer();
  tick = setInterval(function(){ s++; var e=$("sec"); if(e) e.textContent = s; }, 1000);
}
function showErr(text){
  stopTimer();
  var d = document.createElement("div"); d.className = "err"; d.textContent = text;
  $("out").innerHTML = ""; $("out").appendChild(d);
}

function showResult(r, raw){
  stopTimer();
  var map = {
    safe:   {t:"آمن", c:"safe", col:"var(--safe)", h:""},
    bad:    {t:"ضار", c:"bad", col:"var(--bad)", h:"ماتفتحش الرابط ده."},
    review: {t:"راجع فريق الأمن السيبراني", c:"review", col:"var(--warn)", h:"ماتفتحش الرابط لحد ما الفريق يراجعه."}
  };
  var m = map[r.verdict] || map.review;
  var flagged = (r.malicious||0) + (r.suspicious||0);
  var C = 2 * Math.PI * 52;
  var html =
    '<div class="panel"><div class="res">'+
    '<svg class="gauge" viewBox="0 0 120 120" role="img" aria-label="'+flagged+' من '+r.total+'">'+
      '<circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="10"/>'+
      '<circle cx="60" cy="60" r="52" fill="none" stroke="'+m.col+'" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="0" transform="rotate(-90 60 60)"/>'+
      '<text x="60" y="62" text-anchor="middle" font-size="30" font-weight="700">'+flagged+'</text>'+
      '<text x="60" y="84" text-anchor="middle" font-size="12">/ '+r.total+'</text>'+
    '</svg>'+
    '<div class="verdict"><p class="v '+m.c+'">'+m.t+'</p>'+(m.h?'<p class="hint">'+m.h+'</p>':'')+'</div></div>'+
    '<div class="target" id="tg"></div>'+
    '<div class="stats">'+
      '<div class="stat"><b>'+(r.malicious||0)+'</b><span>ضار</span></div>'+
      '<div class="stat"><b>'+(r.suspicious||0)+'</b><span>مشبوه</span></div>'+
      '<div class="stat"><b>'+((r.harmless||0)+(r.undetected||0))+'</b><span>سليم</span></div>'+
    '</div></div>';
  $("out").innerHTML = '<div class="res-wrap">'+html+'</div>';
  $("tg").textContent = raw;
  $("out").scrollIntoView({behavior:"smooth", block:"nearest"});
}

async function scan(){
  if(busy) return;
  var raw = $("u").value.trim();
  if(!raw){ showErr("الصق الرابط الأول."); return; }
  if(raw.length > 2000 || /\s/.test(raw)){ showErr(msg("invalid")); return; }

  busy = true; $("go").disabled = true; showScanning();
  var t0 = Date.now(), LIMIT = 150000;
  try{
    var r;
    while(true){
      r = await call({action:"scan", url:raw});
      if(r.ok || r.error !== "busy") break;
      if(Date.now() - t0 > LIMIT) break;
      await sleep(8000);
    }
    if(!r.ok){ showErr(msg(r.error)); return; }
    if(r.done){ showResult(r.result, raw); return; }

    var id = r.id;
    while(Date.now() - t0 < LIMIT){
      await sleep(6000);
      var q = await call({action:"result", id:id, url:raw});
      if(q.ok && q.done){ showResult(q.result, raw); return; }
      if(!q.ok && q.error !== "busy"){ showErr(msg(q.error)); return; }
    }
    showErr(msg("busy"));
  }catch(e){
    showErr(msg("net"));
  }finally{
    busy = false; $("go").disabled = false; stopTimer();
  }
}

$("go").onclick = scan;
$("u").addEventListener("keydown", function(e){ if(e.key === "Enter") scan(); });
</script>
</body>
</html>
